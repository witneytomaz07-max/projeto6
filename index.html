    <section id="dia1">
      <h2>Dia 1: Tóquio - Tradição e Modernidade</h2>
      <h3>Manhã: Templo Senso-ji em Asakusa</h3>
      <p>Visite o templo budista mais antigo de Tóquio. Passeie pela rua comercial Nakamise para experimentar doces tradicionais e comprar lembrancinhas.</p>
      
      <h3>Tarde: Shibuya e o Cruzamento Famoso</h3>
      <p>Explore o agitado bairro de Shibuya, atravesse o cruzamento mais movimentado do mundo e visite a famosa estátua do cão Hachiko.</p>
    </section>

    <section id="dia2">
      <h2>Dia 2: Quioto - A Capital Cultural</h2>
      <h3>Manhã: Templo Fushimi Inari Taisha</h3>
      <p>Caminhe pelos milhares de portais torii vermelhos que sobem a montanha Sagrada, um dos cenários mais emblemáticos do Japão.</p>
      
      <h3>Tarde: Pavilhão Dourado (Kinkaku-ji)</h3>
      <p>Contemple o impressionante templo zen-budista coberto de folhas de ouro, cercado por um belíssimo jardim tradicional e lago espelhado.</p>
    </section>

    <section id="dia3">
      <h2>Dia 3: Nara e Monte Fuji</h2>
      <h3>Manhã: Parque de Nara</h3>
      <p>Passeie pelo Parque de Nara e interaja com os centenas de cervos que vivem livres pelo local, considerados mensageiros dos deuses.</p>
      
      <h3>Tarde: Região dos Cinco Lagos do Monte Fuji</h3>
      <p>Admire a vista deslumbrante do icônico Monte Fuji a partir do Lago Kawaguchiko e encerre a viagem relaxando em um tradicional Onsen (fonte termal).</p>
    </section>

    <aside id="dicas">
      <h2>O que levar na viagem</h2>
      <ul>
        <li>Passaporte válido com visto (se aplicável)</li>
        <li>Japan Rail Pass (JR Pass) para transporte de trem</li>
        <li>Sapatos fáceis de tirar (para entrar em templos e ambientes tradicionais)</li>
        <li>Adaptador de tomada (padrão japonês de dois pinos chatos)</li>
        <li>Chip de dados ou Wi-Fi portátil (Pocket Wi-Fi)</li>
      </ul>
    </aside>
